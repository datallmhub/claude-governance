id: SEC-001
title: Secrets management
heading: Secrets Management
severity: critical

enforcement:
  agent: true
  ci: true
  pre_commit: true

requirements:
  - Always store secrets in environment variables or a dedicated secrets manager. Never hardcode them in source code.
  - Always add environment files to `.gitignore`. Never commit them.
  - Never log a secret, a token or a connection string, even at debug level.

detect:
  - id: SEC-001.literal-credential
    evaluator: regex
    message: Credential assigned from a literal — load it from the environment instead.
    include: ["**/*.java", "**/*.ts", "**/*.tsx", "**/*.py", "**/*.properties"]
    pattern: |-
      (?i)\b(api[-_]?key|secret|password|passwd|private[-_]?key)\s*[:=]\s*["'][^"'\n${}]{8,}["']

stacks:
  java-react:
    requirements:
      - Always inject secrets with `@Value("${property}")` or Spring Config Server. Never a literal in a `@Configuration` class.
      - Always keep `application-local.properties` out of version control.
  nestjs-react:
    requirements:
      - Always load secrets through `@nestjs/config` `ConfigModule` and read them with `ConfigService.getOrThrow()`.
      - Always validate the whole environment once at bootstrap, so a missing secret fails at startup and not at first request.
    example: |
      ```typescript
      // config/jwt.config.ts
      export default registerAs('jwt', () => ({
        secret: process.env.JWT_SECRET, // validated once at bootstrap via Joi
        expiresIn: '15m',
      }));
      ```
  nextjs:
    requirements:
      - Always read secrets from `process.env` in Server Components, Server Actions or route handlers only. Never in a Client Component.
      - Always prefix a variable with `NEXT_PUBLIC_` only when its value is safe to publish — it is inlined into the browser bundle.
      - Always add `.env*.local` to `.gitignore`.
  python-fastapi-react:
    requirements:
      - Always declare settings in a `pydantic-settings` class loaded from the environment.
      - Always use a local `.env` file for development and keep it in `.gitignore`.
    example: |
      ```python
      class Settings(BaseSettings):
          database_url: str
          jwt_secret: str
          jwt_algorithm: str = "HS256"
          model_config = SettingsConfigDict(env_file=".env")
      ```
  angular-only:
    requirements:
      - Never place a secret in `environment.ts` or `environment.prod.ts` — both ship inside the browser bundle.
      - Always obtain short-lived credentials from the backend at runtime. The browser is never a trusted secret store.
  react-only:
    requirements:
      - Never place a secret in a `VITE_*` or `REACT_APP_*` variable — the bundler inlines its value into the published bundle.
      - Always obtain short-lived credentials from the backend at runtime. The browser is never a trusted secret store.
  vue-only:
    requirements:
      - Never place a secret in a `VITE_*` variable — the bundler inlines its value into the published bundle.
      - Always obtain short-lived credentials from the backend at runtime. The browser is never a trusted secret store.
